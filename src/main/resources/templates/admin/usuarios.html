<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | InkSticker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">

<div th:replace="~{fragments/admin-topbar :: topbar(${adminActual != null ? adminActual.nombre : 'Admin'}, null)}"></div>

<div class="admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('usuarios')}"></div>

    <main class="admin-main">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">Gestión de Usuarios</h1>
                <p class="text-muted mb-0 small">Usuarios registrados en la base de datos de InkSticker.</p>
            </div>
            <span class="badge bg-dark text-warning px-3 py-2 fs-6">
                Total: <span th:text="${usuarios != null ? #lists.size(usuarios) : 0}">0</span>
            </span>
        </div>

        <div class="ink-dark-card p-3 mb-4">
            <div class="row g-2 align-items-center">
                <div class="col-12 col-md-7">
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text"
                               id="filtroUsuarioTexto"
                               class="form-control bg-dark text-light border-secondary"
                               placeholder="Buscar por nombre o correo...">
                    </div>
                </div>
                <div class="col-12 col-md-5">
                    <select id="filtroUsuarioRol" class="form-select bg-dark text-light border-secondary">
                        <option value="">Todos los roles</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="USER">USER</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="ink-dark-card p-4">
            <div class="table-responsive">
                <table id="tablaUsuarios" class="table table-ink-dark table-hover align-middle mb-0 small">
                    <thead>
                    <tr class="text-secondary">
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Ubicación</th>
                        <th>Rol</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${usuarios == null or #lists.isEmpty(usuarios)}">
                        <td colspan="6" class="text-center text-secondary py-4">No hay usuarios registrados en la base de datos.</td>
                    </tr>
                    <tr th:each="usr : ${usuarios}"
                        th:attr="data-rol=${usr.rol != null ? usr.rol : ''}">
                        <td class="text-secondary" th:text="${usr.id}">1</td>
                        <td class="fw-semibold nombre-col" th:text="${usr.nombre}">Nombre</td>
                        <td class="correo-col" th:text="${usr.correo}">correo@ejemplo.com</td>
                        <td th:text="${usr.telefono != null and !#strings.isEmpty(usr.telefono) ? usr.telefono : '-'}">-</td>
                        <td>
                            <span th:text="${usr.canton != null and !#strings.isEmpty(usr.canton) ? usr.canton : ''}"></span>
                            <span th:if="${usr.canton != null and !#strings.isEmpty(usr.canton) and usr.provincia != null and !#strings.isEmpty(usr.provincia)}">, </span>
                            <span th:text="${usr.provincia != null and !#strings.isEmpty(usr.provincia) ? usr.provincia : '-'}"></span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${usr.rol == 'ADMIN'} ? ' bg-warning text-dark' : ' bg-info bg-opacity-25 text-info'"
                                  th:text="${usr.rol != null ? usr.rol : 'SIN ROL'}">ROL</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/admin-footer :: footer}"></div>

<script>
    const textoInput = document.getElementById('filtroUsuarioTexto');
    const rolSelect = document.getElementById('filtroUsuarioRol');
    const filas = document.querySelectorAll('#tablaUsuarios tbody tr[data-rol]');

    function filtrarUsuarios() {
        const q = (textoInput.value || '').toLowerCase().trim();
        const rol = (rolSelect.value || '').toUpperCase().trim();

        filas.forEach(fila => {
            const nombre = (fila.querySelector('.nombre-col')?.textContent || '').toLowerCase();
            const correo = (fila.querySelector('.correo-col')?.textContent || '').toLowerCase();
            const filaRol = (fila.getAttribute('data-rol') || '').toUpperCase();

            const coincideTexto = !q || nombre.includes(q) || correo.includes(q);
            const coincideRol = !rol || filaRol === rol;

            fila.style.display = (coincideTexto && coincideRol) ? '' : 'none';
        });
    }

    textoInput?.addEventListener('input', filtrarUsuarios);
    rolSelect?.addEventListener('change', filtrarUsuarios);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
