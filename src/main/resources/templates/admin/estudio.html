<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio Admin (HU-19) | InkSticker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-info" th:href="@{/admin}">
            <i class="bi bi-shield-lock-fill me-2"></i>InkSticker Admin
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 small">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">
                        <i class="bi bi-speedometer2 me-1"></i>Panel
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/catalogo}">
                        <i class="bi bi-box-seam me-1"></i>Catálogo (HU-16)
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active text-info fw-semibold" th:href="@{/admin/estudio}">
                        <i class="bi bi-shop me-1"></i>Estudio (HU-19)
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/banners}">
                        <i class="bi bi-images me-1"></i>Banners (HU-20)
                    </a>
                </li>
            </ul>
            <a class="btn btn-sm btn-outline-info" th:href="@{/}">
                <i class="bi bi-box-arrow-up-right me-1"></i>Ver tienda
            </a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
        <div>
            <h1 class="h4 mb-0 fw-bold">Configuración del Estudio</h1>
            <small class="text-secondary">HU-19 · Contacto, WhatsApp, ubicación, horarios y redes sociales</small>
        </div>
    </div>

    <div th:if="${exitoMsg}" class="alert alert-success alert-dismissible fade show py-2 small" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i>
        <span th:text="${exitoMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/admin/estudio/guardar}" th:object="${configEstudio}" method="post" class="row g-3 small">
        <div class="col-lg-6">
            <div class="card bg-black border-secondary h-100">
                <div class="card-header border-secondary fw-semibold text-info">Identidad y Contacto</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Nombre del estudio</label>
                        <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                               th:field="*{nombreEstudio}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">WhatsApp (con código de país, ej. 50688888888)</label>
                        <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                               th:field="*{whatsapp}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Mensaje predeterminado de WhatsApp</label>
                        <textarea rows="2" class="form-control form-control-sm bg-dark text-light border-secondary"
                                  th:field="*{mensajeWhatsapp}"></textarea>
                    </div>
                    <div class="mb-0">
                        <label class="form-label text-secondary">Correo de contacto</label>
                        <input type="email" class="form-control form-control-sm bg-dark text-light border-secondary"
                               th:field="*{correoContacto}">
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card bg-black border-secondary h-100">
                <div class="card-header border-secondary fw-semibold text-info">Ubicación, Horario y Redes</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Dirección física</label>
                        <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                               th:field="*{direccionFisica}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">URL Embed del mapa</label>
                        <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                               th:field="*{mapaEmbedUrl}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary">Horario de atención</label>
                        <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                               th:field="*{horarioAtencion}">
                    </div>
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label text-secondary">Instagram URL</label>
                            <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                                   th:field="*{instagramUrl}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary">Facebook URL</label>
                            <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                                   th:field="*{facebookUrl}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary">TikTok URL</label>
                            <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary"
                                   th:field="*{tiktokUrl}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 text-end">
            <button type="submit" class="btn btn-info text-dark fw-semibold px-4">
                <i class="bi bi-save me-1"></i>Guardar Configuración
            </button>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
