<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activePage)" class="admin-sidebar">
    <div class="admin-logo-box">
        INK<span style="color: #d99b00;">STICKER</span> STUDIO
    </div>

    <nav class="nav flex-column">
        <a th:href="@{/admin}"
           class="admin-nav-link"
           th:classappend="${activePage == 'dashboard'} ? ' active'">
            <i class="bi bi-grid-1x2"></i>
            <span>Panel de administración</span>
        </a>

        <a th:href="@{/admin/usuarios}"
           class="admin-nav-link"
           th:classappend="${activePage == 'usuarios'} ? ' active'">
            <i class="bi bi-people"></i>
            <span>Usuarios</span>
        </a>

        <a th:href="@{/admin/productos}"
           class="admin-nav-link"
           th:classappend="${activePage == 'productos'} ? ' active'">
            <i class="bi bi-box-seam"></i>
            <span>Productos</span>
        </a>

        <a th:href="@{/admin/pedidos}"
           class="admin-nav-link"
           th:classappend="${activePage == 'pedidos'} ? ' active'">
            <i class="bi bi-cart3"></i>
            <span>Pedidos</span>
        </a>

        <a th:href="@{/admin/roles}"
           class="admin-nav-link"
           th:classappend="${activePage == 'roles'} ? ' active'">
            <i class="bi bi-shield-check"></i>
            <span>Roles y Permisos</span>
        </a>

        <a th:href="@{/admin/reportes}"
           class="admin-nav-link"
           th:classappend="${activePage == 'reportes'} ? ' active'">
            <i class="bi bi-bar-chart-line"></i>
            <span>Reportes</span>
        </a>

        <a th:href="@{/admin/configuracion}"
           class="admin-nav-link"
           th:classappend="${activePage == 'configuracion'} ? ' active'">
            <i class="bi bi-gear"></i>
            <span>Configuración</span>
        </a>
    </nav>

    <div class="mt-auto pt-3 border-top border-secondary border-opacity-25">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-light w-100">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </div>
</aside>
</body>
</html>
